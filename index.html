<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple random quote generator.">
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <p class="eyebrow">A MOMENT OF INSPIRATION</p>
    <h1>Random Quote Generator</h1>
    <blockquote id="quote">Click the button to discover a quote.</blockquote>
    <p id="author" class="author">— Unknown</p>
    <button id="new-quote" type="button">New quote</button>
    <p class="hint" id="status" aria-live="polite"></p>
  </main>
</body>
</html>
