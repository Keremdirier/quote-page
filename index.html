<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Quote Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Random Quote</h1>
    <blockquote>
      <p id="quote"></p>
      <footer id="author"></footer>
    </blockquote>
    <div class="buttons">
      <button id="new-quote">New quote</button>
      <button id="copy-quote">Copy</button>
      <button id="fav-quote">Save to favourites</button>
    </div>
    <p id="message" aria-live="polite"></p>

    <h2>Favourites</h2>
    <ul id="fav-list"></ul>
    <p id="fav-empty">No favourites yet.</p>
  </main>
  <script src="src/quote.js"></script>
  <script src="script.js"></script>
  <script src="script.js"></script>
</body>
</html>
